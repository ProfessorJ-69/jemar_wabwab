<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a0030;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
  }
  .title {
    font-family: 'Pacifico', cursive;
    font-size: 2.4rem;
    color: #fff;
    margin-bottom: 14px;
    animation: glow 1.5s ease-in-out infinite alternate;
    z-index: 1;
  }
  @keyframes glow {
    from { text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493; }
    to   { text-shadow: 0 0 30px #ff69b4, 0 0 60px #ff1493, 0 0 80px #ffd700; }
  }
  canvas {
    border-radius: 22px;
    box-shadow: 0 0 60px #ff69b480, 0 8px 40px #0008;
    max-width: 95vw;
    max-height: 65vh;
    z-index: 1;
    display: block;
  }
  .footer {
    margin-top: 12px;
    color: #ffb3d9;
    font-size: 1rem;
    letter-spacing: 1px;
    z-index: 1;
  }
  .credit {
    display: inline-block;
    margin-top: 10px;
    color: #ffd700;
    font-family: 'Pacifico', cursive;
    font-size: 1.1rem;
    text-decoration: none;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493;
    border-bottom: 2px dashed #ffd70088;
    padding-bottom: 3px;
    transition: all 0.3s;
    z-index: 1;
    cursor: pointer;
  }
  .credit:hover {
    text-shadow: 0 0 20px #ffd700, 0 0 40px #ff69b4;
    color: #fff;
    border-bottom-color: #fff;
  }
  .confetti-wrap {
    position: fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:0;
  }
  .confetto {
    position:absolute; border-radius:2px;
    animation: fall linear infinite; opacity:0.85;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity:1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity:0.2; }
  }
</style>
</head>
<body>
<div class="confetti-wrap" id="confetti"></div>
<div class="title">🎉 Happy Birthday! 🎉</div>
<canvas id="c"></canvas>
<div class="footer">✨ Wishing you a wonderful day! ✨</div>
<a class="credit" href="https://www.facebook.com" target="_blank">✦ Created by Jemar ✦</a>

<script>
// Confetti
const colors = ['#ff69b4','#ffd700','#00e5ff','#ff4500','#adff2f','#da70d6','#fff'];
const confWrap = document.getElementById('confetti');
for (let i = 0; i < 60; i++) {
  const d = document.createElement('div');
  d.className = 'confetto';
  d.style.left = Math.random()*100 + 'vw';
  d.style.background = colors[Math.floor(Math.random()*colors.length)];
  d.style.animationDuration = (2.5 + Math.random()*4) + 's';
  d.style.animationDelay = (Math.random()*5) + 's';
  d.style.width = (7+Math.random()*10)+'px';
  d.style.height = (10+Math.random()*12)+'px';
  confWrap.appendChild(d);
}

// Canvas
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const balloons = [
  { xp:0.07, yp:0.04, color:'#ff4d6d', size:54, sway:0 },
  { xp:0.20, yp:0.00, color:'#ffd700', size:60, sway:1 },
  { xp:0.35, yp:0.03, color:'#00e5ff', size:50, sway:2 },
  { xp:0.50, yp:-0.01,color:'#adff2f', size:58, sway:0.5 },
  { xp:0.65, yp:0.02, color:'#da70d6', size:55, sway:1.5 },
  { xp:0.80, yp:-0.01,color:'#ff914d', size:52, sway:0.8 },
  { xp:0.93, yp:0.04, color:'#ff69b4', size:57, sway:1.2 },
  { xp:0.13, yp:0.17, color:'#ffe066', size:44, sway:2 },
  { xp:0.87, yp:0.15, color:'#7fffd4', size:46, sway:1.8 },
];

let t = 0;

function shadeColor(hex, amt) {
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,Math.min(255,r+amt));
  g=Math.max(0,Math.min(255,g+amt));
  b=Math.max(0,Math.min(255,b+amt));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function drawBalloon(x, y, r, color, sway) {
  const bx = x + Math.sin(t*0.04+sway)*6;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.35)';
  ctx.shadowBlur=14;
  const grad = ctx.createRadialGradient(bx-r*0.28, y-r*0.28, r*0.08, bx, y, r);
  grad.addColorStop(0,'#fff');
  grad.addColorStop(0.25, color);
  grad.addColorStop(1, shadeColor(color,-50));
  ctx.beginPath();
  ctx.ellipse(bx, y, r, r*1.2, 0, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();
  // Shine
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(bx-r*0.22, y-r*0.32, r*0.22, r*0.13, -Math.PI/5, 0, Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.fill();
  ctx.restore();
  // Knot
  ctx.beginPath();
  ctx.arc(bx, y+r*1.22, r*0.09, 0, Math.PI*2);
  ctx.fillStyle=shadeColor(color,-60);
  ctx.fill();
  // String
  ctx.beginPath();
  ctx.moveTo(bx, y+r*1.3);
  for(let s=0; s<=1; s+=0.05){
    ctx.lineTo(bx+Math.sin(s*Math.PI*3+t*0.06+sway)*5, y+r*1.3+s*r*1.6);
  }
  ctx.strokeStyle=shadeColor(color,-40);
  ctx.lineWidth=1.5;
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  // Top glow
  const topGrad=ctx.createLinearGradient(0,0,0,canvas.height*0.4);
  topGrad.addColorStop(0,'rgba(255,20,147,0.15)');
  topGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=topGrad;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // Balloons
  balloons.forEach(b => {
    drawBalloon(b.xp*canvas.width, b.yp*canvas.height+b.size*1.3, b.size, b.color, b.sway);
  });
  // Text
  ctx.save();
  ctx.font='bold 1.5rem Pacifico, cursive';
  ctx.textAlign='center';
  ctx.fillStyle='#ffd700';
  ctx.shadowColor='#ff1493';
  ctx.shadowBlur=18;
  ctx.fillText('Happy Birthday!', canvas.width/2, canvas.height-20);
  ctx.restore();
  t++;
  requestAnimationFrame(draw);
}

const img = new Image();
img.onload = () => {
  const maxW = Math.min(480, window.innerWidth*0.92);
  const scale = maxW / img.naturalWidth;
  canvas.width  = Math.round(img.naturalWidth  * scale);
  canvas.height = Math.round(img.naturalHeight * scale);
  draw();
};
